name: Android build

# Public release convention: docs/RELEASING.md
#  * branch pushes / PRs  -> CI build only (artifact "CFM-Calculator-CI-<sha>.apk", labelled "-dev"); NOTHING is published
#  * push of a tag vN     -> release build, qualification, GitHub Release "CFM Calculator vN" marked Latest
#  * OR a branch push whose commit has release/deliver == release/VERSION (and no vN release yet) -> same as a tag push;
#    the workflow creates tag vN at that commit (use this when tags cannot be pushed directly)
#  * manual "promote"     -> re-label an already-verified release binary as vN WITHOUT rebuilding it

on:
  push:
    branches: [main, 'ccr-**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      promote_version:
        description: 'Public version number to publish, e.g. 5'
        required: false
      promote_from_tag:
        description: 'Existing verified release tag whose exact binary becomes that version'
        required: false

permissions:
  contents: write   # create releases

env:
  EXPECTED_PACKAGE: com.hotatticgames.cfmcalculator
  PRODUCT: CFM Calculator
  FILE_PREFIX: CFM-Calculator

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve public version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < release/VERSION)"
          [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "release/VERSION must be a single integer"; exit 1; }
          IS_RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+$ ]] || { echo "Release tags must look like v6 (got $GITHUB_REF_NAME)"; exit 1; }
            [ "${GITHUB_REF_NAME#v}" = "$VERSION" ] || { echo "Tag $GITHUB_REF_NAME does not match release/VERSION ($VERSION)"; exit 1; }
            IS_RELEASE=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -f release/deliver ] && [ "$(tr -d '[:space:]' < release/deliver)" = "$VERSION" ] \
               && ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_RELEASE=true   # commit-based delivery request for the next unused version
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IS_RELEASE=$IS_RELEASE" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit, calculation-regression and identity tests
        run: npm test
      - name: Web build
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.head_ref || github.ref_name }}
      - name: Studio splash - built bundle contains the canonical logo
        run: node scripts/verify-splash-asset.mjs
      - name: Studio splash - end-to-end check in a real browser
        run: |
          set -euo pipefail
          npx vite preview --port 4173 --host 127.0.0.1 > "$RUNNER_TEMP/preview.log" 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python3 -m pip install --quiet playwright pillow
          python3 scripts/splash_check.py http://127.0.0.1:4173 "$RUNNER_TEMP/splash-shots"
          kill $PREVIEW_PID
      - name: Capacitor sync
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle (release APK + AAB)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PreleaseBuild="$IS_RELEASE"

      - name: Qualify the actual APK
        run: |
          set -uo pipefail
          if [ "$IS_RELEASE" = true ]; then NAME="${FILE_PREFIX}-v${VERSION}"; else NAME="${FILE_PREFIX}-CI-${GITHUB_SHA::7}"; fi
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          DATASET="$(node -p "require('./src/refrigerant/dataset.json').dataset")"
          echo "DATASET=$DATASET" >> "$GITHUB_ENV"
          mkdir -p out
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" "out/$NAME.apk"
          cp android/app/build/outputs/bundle/release/*.aab "out/$NAME.aab"
          set +e
          { echo "Product: $PRODUCT  Public version: v${VERSION}$([ "$IS_RELEASE" = true ] || echo -dev)"; echo "Source commit: $GITHUB_SHA"; echo "Refrigerant dataset: $DATASET"; echo; scripts/qualify-apk.sh "out/$NAME.apk" "$EXPECTED_PACKAGE" "$(sha256sum Hot_Attic_Games_Master_Logo_ALPHA_FINAL.png | cut -d' ' -f1)"; } | tee out/qualification.md
          rc=${PIPESTATUS[0]}
          cat out/qualification.md >> "$GITHUB_STEP_SUMMARY"
          (cd out && sha256sum "$NAME.apk" "$NAME.aab" | tee SHA256SUMS.txt)
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        # (qualification.md also records the studio-splash artwork check)
        with:
          name: ${{ env.IS_RELEASE == 'true' && format('{0}-v{1}', 'CFM-Calculator', env.VERSION) || 'CFM-Calculator-CI' }}
          path: out/
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_SHA="$(sha256sum "out/$NAME.apk" | cut -d' ' -f1)"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          # ${PRODUCT} v${VERSION}

          **Android - install this file:** \`${NAME}.apk\`

          Next version will be **v$((VERSION + 1))**.

          Debug-signed test key that changes per build: uninstall the previous build before installing.

          ## Technical details (engineering only)
          - Source commit: ${GITHUB_SHA}
          - Android versionCode: ${VERSION} (equals the public version)
          - Package: ${EXPECTED_PACKAGE}
          - APK SHA-256: ${APK_SHA}
          - Refrigerant dataset: ${DATASET}
          - Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Full qualification output: qualification.md; checksums: SHA256SUMS.txt
          EOF
          gh release create "v${VERSION}" out/* --latest --target "$GITHUB_SHA" \
            --title "${PRODUCT} v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"

  promote:
    # Publish an already-built, already-qualified release under its public version WITHOUT rebuilding: the existing release is retitled
    # "CFM Calculator vN", taken off prerelease, made Latest, and its binaries are replaced by identical-bytes copies named CFM-Calculator-vN.*
    # (SHA-256 verified). The historical tag is never touched. Request via "Run workflow" inputs OR a branch push with release/promote.json.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Read promotion request
        id: req
        env:
          INPUT_N: ${{ inputs.promote_version }}
          INPUT_FROM: ${{ inputs.promote_from_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then N="$INPUT_N"; FROM="$INPUT_FROM"
          elif [ -f release/promote.json ]; then N="$(jq -r .version release/promote.json)"; FROM="$(jq -r .from release/promote.json)"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No promotion requested."; exit 0; fi
          [[ "$N" =~ ^[0-9]+$ ]] || { echo "version must be an integer"; exit 1; }
          [ -n "$FROM" ] || { echo "from tag is required"; exit 1; }
          CUR="$(gh release view "$FROM" --json name -q .name)"
          if [ "$CUR" = "${PRODUCT} v${N}" ]; then echo "Release $FROM is already published as '$CUR'. Nothing to do."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh release view "v$N" >/dev/null 2>&1; then echo "A release tagged v$N already exists; versions are never reused."; exit 1; fi
          { echo "run=true"; echo "n=$N"; echo "from=$FROM"; } >> "$GITHUB_OUTPUT"

      - name: Publish existing release as the public version
        if: steps.req.outputs.run == 'true'
        env:
          N: ${{ steps.req.outputs.n }}
          FROM: ${{ steps.req.outputs.from }}
        run: |
          set -euo pipefail
          mkdir dl out
          gh release download "$FROM" -D dl
          APK="$(ls dl/*.apk)"; AAB="$(ls dl/*.aab)"
          WANT="$(grep '\.apk$' dl/SHA256SUMS.txt | cut -d' ' -f1)"
          HAVE="$(sha256sum "$APK" | cut -d' ' -f1)"
          [ "$WANT" = "$HAVE" ] || { echo "APK checksum mismatch: $WANT vs $HAVE"; exit 1; }
          SRC="$(gh api "repos/$GITHUB_REPOSITORY/commits/$FROM" --jq .sha)"
          OLD_APK="$(basename "$APK")"; OLD_AAB="$(basename "$AAB")"
          NAME="${FILE_PREFIX}-v${N}"
          cp "$APK" "out/$NAME.apk"; cp "$AAB" "out/$NAME.aab"; cp dl/qualification.md out/qualification.md
          cmp "$APK" "out/$NAME.apk"
          (cd out && sha256sum "$NAME.apk" "$NAME.aab" > SHA256SUMS.txt)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          # ${PRODUCT} v${N}

          **Android - install this file:** \`${NAME}.apk\`

          Next version will be **v$((N + 1))**.

          Debug-signed test key that changes per build: uninstall any previous test build before installing.

          ## Technical details (engineering only)
          - Binary published UNCHANGED (not rebuilt): identical bytes to the original asset \`${OLD_APK}\`, SHA-256 verified.
          - Source commit: ${SRC}
          - APK SHA-256: ${HAVE}
          - Inside this older build the app shows its engineering version in About ("4.1.0 (build ${N})"); builds from v$((N + 1)) onward show "v$((N + 1))", "v$((N + 2))", ...
          - Android versionCode: ${N}
          - Package: ${EXPECTED_PACKAGE}
          - Historical git tag: \`${FROM}\` (unchanged; kept for provenance)
          - Original asset names: ${OLD_APK}, ${OLD_AAB}
          - Full qualification output: qualification.md; checksums: SHA256SUMS.txt
          EOF
          # upload the clean copies first, then remove the cryptic originals, then present as Latest
          gh release upload "$FROM" out/* --clobber
          gh release delete-asset "$FROM" "$OLD_APK" -y
          gh release delete-asset "$FROM" "$OLD_AAB" -y
          gh release edit "$FROM" --title "${PRODUCT} v${N}" --notes-file "$RUNNER_TEMP/notes.md" --prerelease=false --latest
          # Older release: display title only.
          if gh release view v4.0.0-test.1 >/dev/null 2>&1; then
            gh release edit v4.0.0-test.1 --title "${PRODUCT} v4 (historical test build)" || true
          fi
